# Minimal lighttpd configuration for the bridge: HTTP on 80, HTTPS on 443.
server.document-root = "/var/www"
server.port          = 80
server.username      = "www-data"
server.groupname     = "www-data"
server.pid-file      = "/var/run/lighttpd.pid"

# Errors go to syslog (rotated, in RAM). No access log: it would grow without limit in the tmpfs.
server.errorlog-use-syslog = "enable"

index-file.names = ( "index.html" )
include "conf.d/mime.conf"

# CGI scripts: files ending in .cgi under /cgi-bin are executed (used by the demo page).
server.modules += ( "mod_cgi" )
$HTTP["url"] =~ "^/cgi-bin/" {
	cgi.assign = ( ".cgi" => "" )
}

# HTTPS. The self-signed certificate is created on first boot by /etc/init.d/S49sslcert.
# To use your own, replace /etc/lighttpd/server.pem (private key followed by certificate).
server.modules += ( "mod_openssl" )
$SERVER["socket"] == ":443" {
	ssl.engine  = "enable"
	ssl.pemfile = "/etc/lighttpd/server.pem"
	ssl.openssl.ssl-conf-cmd = ( "MinProtocol" => "TLSv1.2" )
}
