<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bridge</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e3e6ec; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --card:#1c2029; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303c; --accent:#6c9bff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:4px 16px; }
  .row { display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row span:first-child { color:var(--muted); }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  footer { margin-top:16px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1 id="host">bridge</h1>
  <p class="sub">Buildroot on a Raspberry Pi Zero, served by lighttpd.</p>
  <div class="card">
    <div class="row"><span>Address</span><span id="ip">-</span></div>
    <div class="row"><span>Kernel</span><span id="kernel">-</span></div>
    <div class="row"><span>Uptime</span><span id="uptime">-</span></div>
    <div class="row"><span>Load (1, 5, 15 min)</span><span id="load">-</span></div>
    <div class="row"><span>CPU temperature</span><span id="temp">-</span></div>
    <div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Memory</span><span id="mem">-</span></div><div class="bar"><i id="membar"></i></div></div>
    <div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Disk</span><span id="disk">-</span></div><div class="bar"><i id="diskbar"></i></div></div>
  </div>
  <footer id="note">Updating every 5 seconds.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const mb = kb => (kb / 1024).toFixed(0) + " MB";
function dur(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + " d " : "") + h + " h " + m + " min";
}
async function update() {
  try {
    const r = await fetch("cgi-bin/status.cgi", { cache: "no-store" });
    const s = await r.json();
    document.title = s.hostname;
    $("host").textContent = s.hostname;
    $("ip").textContent = s.ip || "-";
    $("kernel").textContent = s.kernel;
    $("uptime").textContent = dur(s.uptime);
    $("load").textContent = s.load;
    $("temp").textContent = s.temp_mc === null ? "not available" : (s.temp_mc / 1000).toFixed(1) + " °C";
    const mu = s.mem_total_kb - s.mem_avail_kb;
    $("mem").textContent = mb(mu) + " of " + mb(s.mem_total_kb);
    $("membar").style.width = (100 * mu / s.mem_total_kb) + "%";
    $("disk").textContent = mb(s.disk_used_kb) + " of " + mb(s.disk_total_kb);
    $("diskbar").style.width = (100 * s.disk_used_kb / s.disk_total_kb) + "%";
    $("note").textContent = "Updating every 5 seconds.";
  } catch (e) {
    $("note").textContent = "Could not read the status (is mod_cgi running?).";
  }
}
update();
setInterval(update, 5000);
</script>
</body>
</html>
