image boot.vfat {
	vfat {
		files = {
#BOOT_FILES#
		}
		# our device tree under the name the firmware loads by default
		file bcm2835-rpi-zero.dtb {
			image = "bcm2835-rpi-zero-bridge.dtb"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
		align = 1M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
